<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A tiny static page deployed with ChatGPT to GitHub Pages." />
  <title>Hello from ChatGPT</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(99,102,241,.22), transparent 34rem),
        radial-gradient(circle at 80% 80%, rgba(16,185,129,.18), transparent 30rem),
        #0b1020;
      color: #f8fafc;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(15,23,42,.7);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      font-size: 14px;
    }
    h1 {
      margin: 22px 0 12px;
      font-size: clamp(42px, 9vw, 76px);
      line-height: .96;
      letter-spacing: -.045em;
    }
    p {
      margin: 0;
      max-width: 56ch;
      color: #cbd5e1;
      font-size: clamp(17px, 2.5vw, 20px);
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }
    button, a {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    button {
      background: #f8fafc;
      color: #0f172a;
    }
    a {
      color: #e2e8f0;
      background: rgba(255,255,255,.08);
    }
    #status {
      margin-top: 18px;
      min-height: 24px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">🚀 GitHub Pages · Static HTML</span>
    <h1>Hello 👋</h1>
    <p>
      这是一个纯静态网页。HTML、CSS 和 JavaScript 都在同一个文件里，
      不需要服务器，也不需要 Vercel。
    </p>
    <div class="actions">
      <button id="btn" type="button">点我试试</button>
      <a href="https://github.com/cdd1037/cdd1037.github.io" target="_blank" rel="noreferrer">查看仓库</a>
    </div>
    <div id="status">页面已加载。</div>
  </main>

  <script>
    const btn = document.querySelector('#btn');
    const status = document.querySelector('#status');
    let count = 0;
    btn.addEventListener('click', () => {
      count += 1;
      status.textContent = '按钮已点击 ' + count + ' 次。这个交互完全运行在浏览器里。';
    });
  </script>
</body>
</html>
